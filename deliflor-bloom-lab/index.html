<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b2176b">
  <title>DELIFLOR Bloom Lab</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fff 0,#fbf5f8 52%,#f0e3eb 100%);font-family:Arial,Helvetica,sans-serif;color:#30222d}.card{width:min(620px,calc(100% - 36px));padding:38px;border-radius:28px;background:rgba(255,255,255,.96);border:1px solid #eadce5;box-shadow:0 24px 70px rgba(92,31,68,.15);text-align:center}.brand{font-weight:900;letter-spacing:.28em;color:#b2176b;font-size:28px;margin-left:.28em}.title{font-size:24px;font-weight:800;margin:20px 0 8px}.text{font-size:14px;line-height:1.55;color:#776572}.bar{height:8px;border-radius:999px;background:#f0dce8;overflow:hidden;margin:24px 0 12px}.bar>i{display:block;height:100%;width:24%;border-radius:inherit;background:linear-gradient(90deg,#b2176b,#dc6aa6);animation:load 1.15s ease-in-out infinite alternate}.small{font-size:12px;color:#9b8794}.error{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#fff0f5;color:#8f1558;font-size:13px;line-height:1.45;word-break:break-word}.retry{display:none;margin:18px auto 0;border:0;border-radius:14px;background:#b2176b;color:#fff;font-weight:800;padding:13px 22px;cursor:pointer}.frames{position:fixed;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:-9999px;top:-9999px}@keyframes load{to{transform:translateX(320%)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">DELIFLOR</div>
    <div class="title">Iniciando Bloom Lab 3D</div>
    <div class="text">Cargando la experiencia interactiva, el visor móvil y la descarga HD.</div>
    <div class="bar"><i></i></div>
    <div class="small" id="status">Preparando la aplicación…</div>
    <div class="error" id="error"></div>
    <button class="retry" id="retry" type="button">Intentar nuevamente</button>
  </main>
  <div class="frames" id="frames"></div>
  <script>
  (()=>{
    'use strict';
    const VERSION='930-20260801';
    const NAMES=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt'];
    const status=document.getElementById('status');
    const errorBox=document.getElementById('error');
    const retry=document.getElementById('retry');
    const frames=document.getElementById('frames');

    function cleanPart(text){
      const value=String(text||'').replace(/\s+/g,'');
      if(value.length<100)throw new Error('Un componente llegó vacío o incompleto.');
      return value;
    }
    function decodeBase64(base64){
      const binary=atob(base64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return bytes;
    }
    function loadWithFrame(name,index){
      return new Promise((resolve,reject)=>{
        const frame=document.createElement('iframe');
        const timer=setTimeout(()=>{frame.remove();reject(new Error(`Tiempo agotado en ${name}`));},20000);
        frame.onload=()=>{
          try{
            const doc=frame.contentDocument||frame.contentWindow.document;
            const text=doc.body?doc.body.innerText||doc.body.textContent:doc.documentElement.textContent;
            const value=cleanPart(text);
            clearTimeout(timer);frame.remove();resolve(value);
          }catch(error){clearTimeout(timer);frame.remove();reject(error);}
        };
        frame.onerror=()=>{clearTimeout(timer);frame.remove();reject(new Error(`No cargó ${name}`));};
        frame.title=`Componente ${index+1}`;
        frame.src=`./${name}?v=${VERSION}`;
        frames.appendChild(frame);
      });
    }
    function loadWithXHR(name){
      return new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.open('GET',`./${name}?v=${VERSION}`,true);
        xhr.timeout=20000;
        xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve(cleanPart(xhr.responseText)):reject(new Error(`HTTP ${xhr.status} en ${name}`));
        xhr.onerror=()=>reject(new Error(`Error de red en ${name}`));
        xhr.ontimeout=()=>reject(new Error(`Tiempo agotado en ${name}`));
        xhr.send();
      });
    }
    async function loadPart(name,index){
      try{return await loadWithFrame(name,index);}catch(frameError){
        console.warn('Fallo iframe, usando XHR',name,frameError);
        return loadWithXHR(name);
      }
    }
    async function start(){
      errorBox.style.display='none';retry.style.display='none';frames.innerHTML='';
      try{
        if(!('DecompressionStream' in window))throw new Error('Abre el enlace en Chrome, Edge o Safari actualizado.');
        const parts=[];
        for(let i=0;i<NAMES.length;i++){
          status.textContent=`Cargando componente ${i+1} de ${NAMES.length}…`;
          parts.push(await loadPart(NAMES[i],i));
        }
        status.textContent='Reconstruyendo Bloom Lab 3D…';
        const bytes=decodeBase64(parts.join(''));
        if(bytes.length<10000)throw new Error('Los componentes reconstruidos están incompletos.');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        let html=await new Response(stream).text();
        if(!/<!doctype html/i.test(html)||!html.includes('DELIFLOR'))throw new Error('El contenido final no es una aplicación DELIFLOR válida.');
        html=html.replace(/new URL\(window\.location\.href\)/g,"new URL('https://www.projectability.net/deliflor-bloom-lab/')");
        document.open();document.write(html);document.close();
      }catch(error){
        console.error(error);status.textContent='No fue posible iniciar el aplicativo.';
        errorBox.style.display='block';retry.style.display='block';
        errorBox.textContent=(error&&error.message)||'Ocurrió un error inesperado.';
      }
    }
    retry.addEventListener('click',start);
    start();
  })();
  </script>
</body>
</html>
